<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaSearch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 420px;
            background: linear-gradient(135deg, #020c2b 0%, #0f1429 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 24px;
            color: #e0e7ff;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #14d4a8, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #searchInput {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(20, 212, 168, 0.3);
            border-radius: 12px;
            background: rgba(15, 20, 41, 0.6);
            backdrop-filter: blur(10px);
            color: #e0e7ff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        #searchInput:focus {
            outline: none;
            border-color: rgba(20, 212, 168, 0.8);
            background: rgba(15, 20, 41, 0.9);
            box-shadow: 0 0 20px rgba(20, 212, 168, 0.2);
        }

        #searchInput::placeholder {
            color: rgba(224, 231, 255, 0.5);
        }

        #resultsContainer {
            max-height: 320px;
            overflow-y: auto;
            border-radius: 8px;
            background: rgba(15, 20, 41, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(20, 212, 168, 0.2);
            min-height: 60px;
        }

        #resultsContainer::-webkit-scrollbar {
            width: 6px;
        }

        #resultsContainer::-webkit-scrollbar-track {
            background: rgba(20, 212, 168, 0.1);
            border-radius: 3px;
        }

        #resultsContainer::-webkit-scrollbar-thumb {
            background: rgba(20, 212, 168, 0.4);
            border-radius: 3px;
        }

        .result-item {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(20, 212, 168, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: rgba(20, 212, 168, 0.1);
        }

        .result-title {
            font-weight: 600;
            font-size: 13px;
            color: #14d4a8;
            margin-bottom: 4px;
        }

        .result-snippet {
            font-size: 12px;
            color: rgba(224, 231, 255, 0.7);
            line-height: 1.4;
        }

        .loading {
            text-align: center;
            padding: 16px;
            color: rgba(224, 231, 255, 0.5);
            font-size: 12px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(20, 212, 168, 0.3);
            border-top-color: #14d4a8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 20px 16px;
            color: rgba(224, 231, 255, 0.5);
            font-size: 12px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(20, 212, 168, 0.3);
            border-radius: 8px;
            background: rgba(20, 212, 168, 0.1);
            color: #14d4a8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(20, 212, 168, 0.2);
            border-color: rgba(20, 212, 168, 0.6);
        }

        .api-status {
            font-size: 10px;
            color: rgba(224, 231, 255, 0.4);
            text-align: center;
            margin-top: 8px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #14d4a8;
            margin-right: 4px;
        }

        .status-dot.offline {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 MetaSearch</h1>
        </div>

        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search anything..."
            autocomplete="off"
        >

        <div id="resultsContainer"></div>

        <div class="controls">
            <button id="settingsBtn">Settings</button>
            <button id="historyBtn">History</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="api-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
